services:
  companion:
    build:
      context: ../..
      dockerfile: packages/companion/Dockerfile
    image: deepcode-companion:latest
    restart: unless-stopped
    ports:
      - "${COMPANION_PORT:-3001}:3001"
    environment:
      DEEPCODE_ADMIN_EMAIL: ${DEEPCODE_ADMIN_EMAIL:?请在 .env 里设置 DEEPCODE_ADMIN_EMAIL}
      DEEPCODE_ADMIN_PASSWORD: ${DEEPCODE_ADMIN_PASSWORD:?请在 .env 里设置 DEEPCODE_ADMIN_PASSWORD}
      DEEPCODE_PUBLIC_ORIGIN: ${DEEPCODE_PUBLIC_ORIGIN:-}
      DEEPCODE_COOKIE_SECURE: ${DEEPCODE_COOKIE_SECURE:-0}
      # 模型配置：只从宿主环境透传，不写进镜像或仓库。
      DEEPCODE_API_KEY: ${DEEPCODE_API_KEY:-}
      DEEPCODE_PROVIDER: ${DEEPCODE_PROVIDER:-}
      DEEPCODE_MODEL: ${DEEPCODE_MODEL:-}
      DEEPCODE_BASE_URL: ${DEEPCODE_BASE_URL:-}
      # 语音输入：同样只从宿主环境透传。
      DEEPCODE_ASR_API_KEY: ${DEEPCODE_ASR_API_KEY:-}
      DEEPCODE_ASR_BASE_URL: ${DEEPCODE_ASR_BASE_URL:-}
      DEEPCODE_ASR_MODEL: ${DEEPCODE_ASR_MODEL:-}
      DEEPCODE_ASR_LANGUAGE: ${DEEPCODE_ASR_LANGUAGE:-}
      DEEPCODE_ASR_PROVIDER: ${DEEPCODE_ASR_PROVIDER:-}
      DEEPCODE_ASR_MODEL_DIR: ${DEEPCODE_ASR_MODEL_DIR:-}
      DEEPCODE_ASR_NUM_THREADS: ${DEEPCODE_ASR_NUM_THREADS:-}
      DEEPCODE_ASR_APP_ID: ${DEEPCODE_ASR_APP_ID:-}
      DEEPCODE_ASR_API_SECRET: ${DEEPCODE_ASR_API_SECRET:-}
    volumes:
      - companion-data:/data
      # 本地模型：把宿主机模型目录挂进来，MODEL_DIR 指向容器内路径。
      # - ./models/asr:/models/asr:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  companion-data:
