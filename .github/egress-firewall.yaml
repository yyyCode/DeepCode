# 出口白名单。三条规矩（抄参考实现，它写在文件头）：
#   1. 只在真的有 step 需要时加；2. 写全名，禁 `*`；3. 注明用途。
#
# 我们的 agent job 不联网 —— 它用一个假 provider 把引擎端到端跑一遍，模型响应是脚本化的。
# 唯一的出网是装依赖。所以这份白名单只有一条，而且它**永远**只有一条：
# 哪天要再加，先问"这一条是不是也能在本地跑"。
#
# `mode: enforce` 是这份文件里最要紧的一行。`report` 只是看着像在管。
mode: enforce
allow:
  - host: registry.npmjs.org      # pnpm install
    port: 443
